    </text>
    <text y="50" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="16" fill="#525250" letter-spacing="2px" text-transform="uppercase">
