    <circle cx="-50" cy="0" r="80" fill="#1A6B3A" opacity="0.15" />
    <circle cx="50" cy="0" r="80" fill="#F5A623" opacity="0.1" />
  </g>
  <!-- Text del Logo -->
  <g transform="translate(400, 370)">
